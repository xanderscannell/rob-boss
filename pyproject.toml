[project]
name = "rob-boss"
version = "0.1.0"
description = "RobBoss - learn to paint a picture layer by layer, in the browser"
requires-python = ">=3.11,<3.14"
dependencies = [
    "opencv-python>=4.8",   # guide rendering, canvas image IO
    "numpy>=1.24",
    "pillow>=10",           # image IO for the layer decomposition
    "pydantic>=2.5",        # lesson step schema
]

[tool.uv]
package = false             # plain scripts, nothing to build/install
